# Only tools used by this repository; Rust is pinned in rust-toolchain.toml.
[tools]
bun = "1.3.14"
zig = "0.14.1"

[tasks.test]
run = ["cargo build --locked --workspace", "cargo test --locked --workspace", "cargo test --locked --workspace --release", "bun test clients/browser-extension/tests/client.test.mjs clients/integration/provider.test.mjs", "bun scripts/check-bebop-alignment.mjs", "bun scripts/check-bebop-alignment.test.mjs"]

[tasks.proofs]
run = 'bash tests/check_proofs.sh "${PROOF_EVIDENCE_DIR:?Set an absolute evidence directory}"'
