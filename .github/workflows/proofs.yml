# This workflow is managed by gh actions-lock.
# Idris2 proof gate — REAL as of PROOFS-1 completion (owner ruling 2026-07-27:
# finish the relocation). Typechecks groove-proofs.ipkg: the three relocated
# proof modules plus byte-identical vendored Gossamer.ABI.{Types,Groove} deps
# (proofs/VENDOR.json), whose integrity against the pinned upstream commit is
# verified by the vendor-integrity job.
#
# ipkg-based `--typecheck` is load-bearing: idris2 0.7.0 `--check file.idr`
# exits 0 on module-load errors (measured 2026-07-27), so a per-file loop is a
# fake gate. Do NOT reintroduce `continue-on-error` and do NOT switch back to
# per-file `--check`.
name: proofs

on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday morning

permissions:
  actions: read
  contents: read

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-integrity:
    name: vendored deps match pinned upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: diff vendored files against their pinned source commit
        run: |
          set -euo pipefail
          jq -c '.entries[]' proofs/VENDOR.json | while read -r e; do
            file=$(jq -r '.file' <<<"$e")
            repo=$(jq -r '.source_repo' <<<"$e")
            ref=$(jq -r '.source_ref' <<<"$e")
            path=$(jq -r '.source_path' <<<"$e")
            echo "== $file  <-  $repo@$ref:$path"
            curl -fsSL "https://raw.githubusercontent.com/$repo/$ref/$path" -o /tmp/upstream.idr
            diff -u /tmp/upstream.idr "$file"
          done
          echo "vendored files are byte-identical to their pinned upstream"

  typecheck:
    name: idris2 typecheck (groove-proofs.ipkg)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Chez Scheme
        run: sudo apt-get update && sudo apt-get install -y chezscheme
      - name: Build & install Idris2 (pinned v0.8.0, gossamer's proven recipe)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.8.0 https://github.com/idris-lang/Idris2.git "$RUNNER_TEMP/Idris2"
          test "$(git -C "$RUNNER_TEMP/Idris2" rev-parse HEAD)" = 15a3e4e70843f7a34100f6470c04b791330788df
          cd "$RUNNER_TEMP/Idris2"
          make bootstrap SCHEME=chezscheme
          make install
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
      - name: Typecheck the proofs package
        run: bash tests/check_proofs.sh "$RUNNER_TEMP/groove-proof-evidence"
