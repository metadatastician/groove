name: Temporary official lock refresh
on:
  pull_request:
    paths: ['.github/workflows/arena-lock-refresh.yml']
permissions:
  contents: read
  issues: write
jobs:
  refresh:
    if: github.head_ref == 'arena/361fec92-groove' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: arena/361fec92-groove
      - run: gh extension install github/gh-actions-lock --pin v0.1.6
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          rm .github/workflows/arena-lock-refresh.yml
          rm .github/workflows/actions.lock
          if ! gh actions-lock > /tmp/lock-output 2>&1; then
            while IFS= read -r line; do echo "::error::$line"; done < /tmp/lock-output
            exit 1
          fi
          gh actions-lock --verify-local
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          Path('/tmp/comment.json').write_text(json.dumps({'body': 'Official gh actions-lock v0.1.6 output (verified):\n```yaml\n' + Path('.github/workflows/actions.lock').read_text() + '\n```'}))
          PYTHON
          gh api repos/${{ github.repository }}/issues/67/comments --input /tmp/comment.json
        env:
          GH_TOKEN: ${{ github.token }}
