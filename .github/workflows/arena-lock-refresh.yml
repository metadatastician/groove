name: Temporary official lock refresh
on:
  pull_request:
    paths: ['.github/workflows/arena-lock-refresh.yml']
permissions:
  contents: write
jobs:
  refresh:
    if: github.head_ref == 'arena/361fec92-groove' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: arena/361fec92-groove
      - run: gh extension install github/gh-actions-lock --pin v0.1.6
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          rm .github/workflows/arena-lock-refresh.yml
          gh actions-lock
          gh actions-lock --verify-local
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'ci: regenerate action lock with official v0.1.6 and remove bootstrap'
          git push origin HEAD:arena/361fec92-groove
        env:
          GH_TOKEN: ${{ github.token }}
