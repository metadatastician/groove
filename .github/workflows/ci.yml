# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Groove protocol CI — small real matrix (ADR 0008): every job exercises an
# actual artifact. The registry file is the single source of truth (ADR 0006);
# drift anywhere fails the build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  rust:
    name: build + test (workspace incl. conformance suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Pinned to the v1 TAG, not the `stable` BRANCH. dtolnay force-moves
      # `stable` on each Rust release, so a lockfile pin to it stops being
      # reachable from the branch and enforcement rejects the job with
      # "Lockfile pin ... does not match ref `stable`" — measured here on
      # 2026-08-07. The ref selects the ACTION version only; the toolchain
      # comes from the explicit input below (dtolnay otherwise reads the
      # toolchain from the ref name).
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - run: cargo build --locked --workspace
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --release
      - run: bun test clients/integration/provider.test.mjs

  registry-drift:
    name: generated port tables match registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun clients/browser-extension/scripts/gen-targets.mjs --check

  webext:
    name: browser extension lint + structure + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bunx --bun web-ext@8.9.0 lint --source-dir clients/browser-extension --ignore-files 'tests/**' 'scripts/**'
      - run: bash clients/browser-extension/tests/validate_structure.sh
      - run: bun test clients/browser-extension/tests/client.test.mjs

  zig:
    name: GRV6 reference (zig build test)
    runs-on: ubuntu-latest
    # Verified locally on Zig 0.14.1: all 10 GRV6 tests pass. This is required.
    steps:
      - uses: actions/checkout@v7.0.1
      # Pin the zig version the reference targets. The code uses std.net
      # (Address.parseIp6 / addr.listen / server.accept) and
      # std.time.nanoTimestamp — both removed by zig 0.16's std.Io networking
      # rework. Migrating reference/ipv6t to the 0.16 Io API is a tracked
      # follow-up; until then, build against 0.14.x as authored.
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.14.1
      - run: zig build test
        working-directory: reference/ipv6t

  spec-consistency:
    name: spec/conformance/version coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - name: every CONF ID in CONFORMANCE.adoc has a matching test
        run: |
          set -euo pipefail
          missing=0
          ids=$(grep -oE 'CONF-L[0-9]-[0-9]{2}' spec/CONFORMANCE.adoc | sort -u)
          while IFS= read -r id; do
            fn=$(echo "$id" | tr 'A-Z-' 'a-z_')
            if ! grep -rq "fn ${fn}" provider/tests/; then
              echo "MISSING TEST for ${id} (expected fn ${fn} in provider/tests/)"
              missing=1
            fi
          done <<< "$ids"
          exit $missing
      - name: version string coherent across Cargo.toml / SPEC / README
        run: |
          set -euo pipefail
          v=$(grep -m1 '^version' cli/Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "cli version: $v"
          grep -q "$v" spec/SPEC.adoc || { echo "SPEC.adoc does not mention $v"; exit 1; }
          grep -q "$v" README.adoc || { echo "README.adoc does not mention $v"; exit 1; }
      - name: Bebop voice_signal alignment conformance (spline ADR-0005 criterion (c))
        run: bun scripts/check-bebop-alignment.mjs
      - name: Bebop alignment checker self-test (falsifiability proof)
        run: bun scripts/check-bebop-alignment.test.mjs
      - name: no stray license references outside LICENSES/ and ADRs
        run: |
          set -euo pipefail
          if grep -rn "PMPL\|AGPL-3" --include='*.adoc' --include='*.md' --include='*.toml' . \
            | grep -v '^./LICENSES/' | grep -v 'docs/decisions/0004' | grep -v 'docs/archive/'; then
            echo "stray PMPL/AGPL reference found (see above)"; exit 1
          fi
