name: Secret Scanner
on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Three read-only scanner contexts: gitleaks, rust-secrets, shell-secrets.
# Full-SHA pin runtime-validated in enaction-engine run 42367280154 (2026-11-07):
# https://github.com/catachresis-colloquium/enaction-engine/actions/runs/42367280154
# Keep the validated SHA rather than following an unvalidated standards tip.
# The reusable gates working tree, history and AsciiDoc mirror scans with a
# checksum-verified gitleaks binary. Our .gitleaks.toml supplies local config;
# the reusable stages an estate baseline only when absent or explicitly extended.
# No secrets are passed; the callee needs only contents: read.
jobs:
  scan:
    permissions:
      contents: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@b8f60511e76c9015d86990317162dce653c92fe1
