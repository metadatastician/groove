name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
# Single secret scanner: the standards reusable runs gitleaks (+ a Rust-secrets
# check) against a checksum-verified pinned binary, `gitleaks detect
# --exit-code 1` — a gate that actually fails on a real finding.
#
# ── Why this is pinned to standards main, not the template's pin ────────────
#
# The RSR template ships an older pin whose gitleaks step is
# `continue-on-error: true` (a gate that cannot fail) and whose job requests
# `pull-requests: write` + `actions: read`, which a caller with only
# `contents: read` at the top-level `permissions:` cannot grant — that
# combination 0-second `startup_failure`s before a single step runs. Pinning
# to the current reusable avoids both; see enaction-engine's
# .github/workflows/secret-scanner.yml for the fuller writeup.
#
# ── Why .gitleaks.toml is committed here ─────────────────────────────────────
#
# The reusable runs `gitleaks detect --source .` with no `--config`; gitleaks
# auto-discovers `.gitleaks.toml` from `--source`, i.e. from THIS repo. A
# baseline-less repo gets a real, gating scan against Cargo.lock integrity
# hashes and similar false positives. The baseline and the re-pin must land
# together.
jobs:
  scan:
    permissions:
      contents: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@7fdc2705df74b4e352d2a1cde3e87a5923fdf329
    secrets: inherit
